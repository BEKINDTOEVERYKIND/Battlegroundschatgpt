name: Engine and training checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: python
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements.txt
      - name: Fetch and verify pinned external recruit dependency
        run: python scripts/prepare_recruit_engine.py
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - name: Check frozen source integrity
        run: python -c "from bg_ai.provenance import load_snapshot; print(load_snapshot('data/ruleset.json')['ruleset_id'])"
