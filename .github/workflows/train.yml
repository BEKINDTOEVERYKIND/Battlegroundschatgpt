name: Bounded current-pool training
on:
  push:
    branches: [main]
    paths: [config/training-job.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battlegrounds-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: python
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements.txt
      - name: Validate frozen data and corrected combat adapter
        run: |
          python scripts/sync_ruleset.py --check
          npm test
      - name: Train and independently evaluate scratch and warm starts
        timeout-minutes: 320
        run: python scripts/run_training_job.py --out training-output
      - name: Preserve checkpoints, labels, choices, results, and partial failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: training-${{ github.run_id }}-${{ github.run_attempt }}
          path: training-output/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
